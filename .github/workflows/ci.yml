name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    name: offline tests + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the secret scan also walks committed content

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No third-party dependencies and no credentials: the suites are stdlib-only
      # and the live routing group is opt-in (RUN_LIVE_TESTS), so CI can never call
      # an external service even if a runner happened to carry a credential.
      - name: router tests (offline)
        run: python3 tests/test_router.py

      - name: kill-switch resolver tests
        run: python3 tests/test_state.py

      - name: human-turn provenance boundary (dual gate, concurrency, telemetry)
        run: python3 tests/test_turn_boundary.py

      # The checker must not be able to claim "healthy" when it cannot see a Hermes tree: a
      # silent pass there would be worse than no checker at all.
      - name: drift checker refuses to report healthy without a Hermes checkout
        run: |
          set +e
          python3 tools/check_turn_origin_patch.py --hermes-root /nonexistent >/dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then echo "expected exit 3, got $code"; exit 1; fi

      - name: secret-scanner control tests (positive / negative / adversarial)
        run: python3 tests/test_secret_scan.py

      - name: installer tests (fake hermes CLI, throwaway HERMES_HOME)
        run: bash tests/test_installer.sh

      # The convergence rehearsal is the acceptance test for a future install: it fails if
      # telemetry continuity, the human-turn boundary, redaction or the route-availability
      # contract regresses, and it never calls an external service.
      - name: convergence rehearsal (generation metadata, boundary, redaction, dossier)
        run: python3 tests/test_convergence_rehearsal.py

      # Both analysis tools are offline and read-only, and their suites emulate a live
      # deployment at sentinel paths to prove that an offline run cannot read or write one.
      - name: routing-quality aggregates (generation-aware, offline)
        run: python3 tests/test_routing_quality.py

      - name: privacy-safe outcome signals (joinability audit, offline)
        run: python3 tests/test_outcome_signals.py

      # The prospective telemetry candidate is not deployed: this suite drives the real
      # handlers offline and proves content blindness, single terminal per turn, concurrency
      # isolation and sentinel byte-identity.
      - name: prospective outcome telemetry (offline, content-blind)
        run: python3 tests/test_outcome_telemetry.py

      # The gate reads a source tree only: it proves the hooks the candidate needs still exist
      # and still carry their load-bearing fields. On a runner without a Hermes checkout it
      # validates against a fixture tree it builds itself, so the job stays hermetic and honest.
      - name: hook-contract gate (source compatibility, offline)
        run: python3 tests/test_hook_contract.py

      # Deployment rehearsal: export the committed revision, load it in a fresh process through a
      # fake hook registry with an isolated log dir and shadow state, sockets blocked. No install.
      - name: deployment rehearsal (frozen export, no network, no install)
        run: python3 tests/test_deployment_rehearsal.py

      - name: state initialiser (dry run)
        run: python3 tools/init_state.py --dry-run

      # The scan must be able to fail, and "clean" must mean "everything was scanned":
      # a bare scan that cannot run history, or leaves objects unread, is not a pass.
      - name: secret / privacy scan (tree + history, fail on incomplete)
        run: python3 tools/secret_scan.py --root . --git
