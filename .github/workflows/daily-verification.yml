name: daily verification

on:
  schedule:
    # 00:20 Asia/Shanghai (UTC+8). GitHub schedules are expressed in UTC.
    - cron: "20 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-verification
  cancel-in-progress: false

jobs:
  verify-and-log:
    name: verify repository and update daily ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run offline verification
        id: verify
        shell: bash
        run: |
          set +e

          python3 tests/test_router.py
          r_router=$?

          python3 tests/test_state.py
          r_state=$?

          python3 tests/test_turn_boundary.py
          r_boundary=$?

          python3 tests/test_secret_scan.py
          r_scanner=$?

          bash tests/test_installer.sh
          r_installer=$?

          python3 tools/init_state.py --dry-run
          r_init=$?

          python3 tools/secret_scan.py --root . --git
          r_repo_scan=$?

          set -e

          if [ "$r_router" -eq 0 ] &&
             [ "$r_state" -eq 0 ] &&
             [ "$r_boundary" -eq 0 ] &&
             [ "$r_scanner" -eq 0 ] &&
             [ "$r_installer" -eq 0 ] &&
             [ "$r_init" -eq 0 ] &&
             [ "$r_repo_scan" -eq 0 ]; then
            result="PASS"
          else
            result="FAIL"
          fi

          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "router=$r_router" >> "$GITHUB_OUTPUT"
          echo "state=$r_state" >> "$GITHUB_OUTPUT"
          echo "boundary=$r_boundary" >> "$GITHUB_OUTPUT"
          echo "scanner=$r_scanner" >> "$GITHUB_OUTPUT"
          echo "installer=$r_installer" >> "$GITHUB_OUTPUT"
          echo "init=$r_init" >> "$GITHUB_OUTPUT"
          echo "repo_scan=$r_repo_scan" >> "$GITHUB_OUTPUT"

      - name: Update Beijing-date ledger
        env:
          RESULT: ${{ steps.verify.outputs.result }}
          ROUTER: ${{ steps.verify.outputs.router }}
          STATE: ${{ steps.verify.outputs.state }}
          BOUNDARY: ${{ steps.verify.outputs.boundary }}
          SCANNER: ${{ steps.verify.outputs.scanner }}
          INSTALLER: ${{ steps.verify.outputs.installer }}
          INIT: ${{ steps.verify.outputs.init }}
          REPO_SCAN: ${{ steps.verify.outputs.repo_scan }}
        run: |
          export TZ=Asia/Shanghai
          day="$(date +%F)"
          tested_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"

          checks="router=$ROUTER,state=$STATE,boundary=$BOUNDARY,scanner=$SCANNER,installer=$INSTALLER,init=$INIT,repo-scan=$REPO_SCAN"

          python3 - "$day" "$RESULT" "$short_sha" "$checks" <<'PY'
          from pathlib import Path
          import sys

          path = Path("docs/daily-status.md")
          day, result, sha, checks = sys.argv[1:]
          row = f"| {day} | {result} | `{sha}` | `{checks}` |"

          text = path.read_text(encoding="utf-8")
          lines = text.splitlines()
          replaced = False
          for i, line in enumerate(lines):
              if line.startswith(f"| {day} |"):
                  lines[i] = row
                  replaced = True
                  break
          if not replaced:
              lines.append(row)

          path.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")
          PY

          git config user.name "INEEDBUG"
          git config user.email "97193467+INEEDBUG@users.noreply.github.com"

          git add docs/daily-status.md
          if git diff --cached --quiet; then
            echo "Daily ledger already up to date for $day."
          else
            git commit -m "chore(daily): verify repository $day [skip ci]"
            git push
          fi

          echo "Tested source commit: $tested_sha"

      - name: Fail workflow if verification failed
        if: steps.verify.outputs.result != 'PASS'
        run: exit 1
