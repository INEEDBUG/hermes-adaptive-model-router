name: jev-shadow-router
# Version of record: mirrored by router/__init__.py:__version__ and enforced by
# tools/check_outcome_hook_contract.py. No git tag exists (no release policy).
version: "0.3.0"
description: "Shadow-only routing observer: asks a TypeSafe JEV routing service for a route decision once per user turn, logs the decision and never changes the executing model."
author: "hermes-adaptive-model-router contributors"
kind: standalone
hooks:
  - pre_api_request
  # Prospective outcome telemetry (repository candidate): structural execution facts for an
  # admitted human turn, one terminal record per turn. Content-blind; see router/outcome.py.
  - post_api_request
  - api_request_error
  - post_llm_call
  - agent_loop_stopped
